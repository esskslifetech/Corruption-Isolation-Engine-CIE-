[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --strict-config --durations=10
markers =
    unit: unit tests
    integration: end-to-end tests
    slow: slower tests (large corpora, benchmarks)
minversion = 7.0
filterwarnings =
    ignore::DeprecationWarning
