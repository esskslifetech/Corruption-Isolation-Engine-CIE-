[tool:pytest]
# Pytest configuration for CIE tests

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for complete workflows
    slow: Tests that take a long time to run
    network: Tests that require network access
    database: Tests that require database operations
    quarantine: Tests that involve quarantine operations
    performance: Performance benchmarking tests
    security: Security-related tests

# Minimum version
minversion = 6.0

# Test coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
